version: 2

formats:
  - htmlzip

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.13"

python:
  install:
    - method: uv
      command: sync
      extras:
        - fromdecay
        - vector
      groups:
        - doc

sphinx:
  builder: html
  configuration: docs/conf.py
#  fail_on_warning: true
