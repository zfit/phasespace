version: 2

multi-ecosystem-groups:
  lock:
    commit-message: { prefix: "build(deps)" }
    schedule: { interval: quarterly }

updates:
  - package-ecosystem: github-actions
    directory: "/"
    multi-ecosystem-group: lock
    patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: "/"
    multi-ecosystem-group: lock
    patterns: ["*"]
