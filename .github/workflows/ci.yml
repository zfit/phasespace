# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - main
      - develop
      - "release/*"
      - "hotfix/*"
  pull_request:
    branches-ignore:
      - "docs/*"
      - "doc/*"


jobs:
  download-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache test data
        id: cache-data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/large
          key: test-data-${{ hashFiles('data/download_test_files.py') }}
      - name: Set up Python
        if: steps.cache-data.outputs.cache-hit != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Install wget
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: pip install wget
      - name: Download test data
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: PHASESPACE_SILENT=1 python data/download_test_files.py
      - name: Upload test data artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-data
          path: data/large
          retention-days: 1

  codecov:
    needs: download-data
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download test data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-data
          path: data/large
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          sudo apt install graphviz -y
          uv pip install -e .[all] --group dev --system
      - name: Run pytest-cov
        run: PYTHONPATH=src coverage run -m pytest
      - name: Create XML report
        run: coverage xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: ./coverage.xml

  pytest:
    needs: download-data
    runs-on: ${{ matrix.os }}
    name: tests ${{ matrix.os }}, ${{ matrix.python-version }}, eager=${{ matrix.eager }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]
        eager: [0, 1]
        include:
          - os: macos-latest  # Apple silicon runner
            python-version: '3.13'
            eager: 0
          - os: windows-latest
            python-version: '3.13'
            eager: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download test data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-data
          path: data/large
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@97330871fe1b7d3529392ea000e3d2c4b357e403 # v3.0.0
        id: cpu-cores
      - name: Install graphviz (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt install graphviz -y
      - name: Install graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz
      - name: Install graphviz (Windows)
        if: runner.os == 'Windows'
        run: choco install graphviz -y
      - name: Install dependencies
        run: uv pip install -e .[all] --group dev --system
      - name: Test with pytest, eager=${{ matrix.eager }}
        run: |
          PHASESPACE_EAGER=${{ matrix.eager }} pytest -n auto tests
          cd docs
          PHASESPACE_EAGER=${{ matrix.eager }} pytest --dist loadscope --nbval-lax --ignore=.ipynb_checkpoints -n${{ steps.cpu-cores.outputs.count }}
          cd ..
        shell: bash
